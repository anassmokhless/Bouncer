name: Build and Deploy

# Triggered on push to main. Can also be triggered manually
# from the GitHub Actions UI (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Cheap type-check gate so obviously broken code doesn't ship. Catches
  # TS errors in CI before they'd cause a failed rebuild on the VPS.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/deploy/tgbot
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker exec tgbot-dashboard node dist/shared/migrate.js || true
            docker image prune -f
